services:
  app:
    build:
      dockerfile: ./Dockerfile
      context: ./
    ports:
      - "8000:8000"
    volumes:
      - ./migrations/versions:/fastapi_ecommerce/migrations/versions
      - ./app/:/fastapi_ecommerce/app/
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
  pg:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: fastapi_ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ecommerce -d fastapi_ecommerce" ]
      interval: 5s
      timeout: 3s
      retries: 3

  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.org
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     pg:
  #       condition: service_healthy

  redis:
    image: redis:8.10-alpine
    container_name: fastapi_ecommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redis-network

  redis-gui:
    image: redis/redisinsight:latest
    container_name: fastapi_ecommerce_redis_gui
    ports:
      - "5540:5540"
    networks:
      - redis-network

volumes:
  pgdata:
  redis_data:

networks:
  redis-network:
    driver: bridge
